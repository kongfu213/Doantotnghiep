controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # --- BỘ ĐIỀU KHIỂN CHO TAY TRÁI (LEFT) ---
    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    left_finger_width_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # --- BỘ ĐIỀU KHIỂN CHO TAY PHẢI (RIGHT) ---
    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    right_finger_width_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# =========================================================================
# CẤU HÌNH CHI TIẾT TAY TRÁI (LEFT)
# =========================================================================
left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      left_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      left_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      left_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

left_scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    speed_scaling_interface_name: "left_speed_scaling/speed_scaling_factor"
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      left_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      left_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      left_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

left_finger_width_trajectory_controller:
  ros__parameters:
    joints:
      - left_finger_width
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: true

