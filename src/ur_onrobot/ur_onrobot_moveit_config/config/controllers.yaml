controller_names:
  - left_scaled_joint_trajectory_controller
  - left_joint_trajectory_controller
  - left_finger_width_trajectory_controller
  - right_scaled_joint_trajectory_controller
  - right_joint_trajectory_controller
  - right_finger_width_trajectory_controller

# ==================== CẤU HÌNH TAY TRÁI (LEFT) ====================

left_scaled_joint_trajectory_controller:
  action_ns: left_scaled_joint_trajectory_controller/follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - left_shoulder_pan_joint
    - left_shoulder_lift_joint
    - left_elbow_joint
    - left_wrist_1_joint
    - left_wrist_2_joint
    - left_wrist_3_joint

left_joint_trajectory_controller:
  action_ns: left_joint_trajectory_controller/follow_joint_trajectory
  type: FollowJointTrajectory
  default: false
  joints:
    - left_shoulder_pan_joint
    - left_shoulder_lift_joint
    - left_elbow_joint
    - left_wrist_1_joint
    - left_wrist_2_joint
    - left_wrist_3_joint

left_finger_width_trajectory_controller:
  action_ns: left_finger_width_trajectory_controller/follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - left_finger_width

# ==================== CẤU HÌNH TAY PHẢI (RIGHT) ====================

